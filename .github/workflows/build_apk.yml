name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Tooling
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      - name: Unzip Workspace Zip if Present
        run: |
          if [ -f "workspace/project.zip" ]; then
            echo "Unzipping workspace/project.zip..."
            unzip -o workspace/project.zip || true
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "./gradlew" ] || [ ! -s "./gradlew" ]; then
            echo "Generating Gradle wrapper 8.7..."
            gradle wrapper --gradle-version 8.7 || true
          fi
          chmod +x gradlew || true

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace || ./gradlew assembleRelease --stacktrace || gradle assembleDebug --stacktrace || gradle assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.apk